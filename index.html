<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — ManagRE Retail Real Estate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f0f0;
      color: #1c2b5e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    .logo-wrap {
      margin-bottom: 48px;
    }

    .logo-wrap img {
      width: 220px;
      height: auto;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #b8952a;
      margin: 0 auto 36px;
      border-radius: 2px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 16px;
      color: #1c2b5e;
    }

    h1 span {
      color: #b8952a;
    }

    p.subtitle {
      font-size: 1.05rem;
      font-weight: 300;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 48px;
    }

    .contact-line {
      font-size: 0.875rem;
      color: #9ca3af;
      letter-spacing: 0.03em;
    }

    .contact-line a {
      color: #b8952a;
      text-decoration: none;
      font-weight: 600;
    }

    .contact-line a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 64px;
      font-size: 0.75rem;
      color: #b0b8c1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
