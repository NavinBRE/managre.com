<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f2033;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px}
.box{background:#13263c;border:1px solid #22364e;border-radius:16px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mk{background:#1f6feb;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 12px}
h1{font-size:17px;margin:0 0 4px;letter-spacing:.3px}.sub{color:#9db3c9;font-size:13px;margin:0 0 20px}
input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #33495f;background:#0d1b2c;color:#fff;font-size:16px;text-align:center;letter-spacing:1px}
input:focus{outline:none;border-color:#1f6feb}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:hover{background:#1a5fce}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px}
.ft{color:#5b7086;font-size:11px;margin-top:16px}
</style></head>
<body>
<div class="box">
  <div class="mk">M</div>

function b2u(b){var r=atob(b),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function tryOne(pw,p){
  var raw=b2u(p),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function unlock(pw){
  for(var i=0;i<PAYLOADS.length;i++){
    try{ var html=await tryOne(pw,PAYLOADS[i]); try{sessionStorage.setItem('mgr_pw',pw);}catch(e){} document.open();document.write(html);document.close(); return; }catch(e){}
  }
  throw new Error('no match');
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
  document.getElementById('err').textContent='';
  unlock(document.getElementById('pw').value).catch(function(){document.getElementById('err').textContent='Incorrect password.';});
});
(function(){try{var s=sessionStorage.getItem('mgr_pw');if(s)unlock(s).catch(function(){try{sessionStorage.removeItem('mgr_pw');}catch(e){}});}catch(e){}})();
