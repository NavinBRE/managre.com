/* Session keys. The current key is first; the others are keys written by earlier
   builds of the hub. We READ all of them and WRITE all of them, so a cached or
   stale hub page still hands its unlock off to a freshly-uploaded deal page and
   the visitor is never asked for the password twice in one session. */
var SK=['mre_client_pw','pmg_deals_pw','mre_deals_pw'];
function skRead(){try{for(var i=0;i<SK.length;i++){var v=sessionStorage.getItem(SK[i]);if(v)return v}}catch(e){}return null}
function skWrite(pw){try{for(var i=0;i<SK.length;i++)sessionStorage.setItem(SK[i],pw)}catch(e){}}
function skClear(){try{for(var i=0;i<SK.length;i++)sessionStorage.removeItem(SK[i])}catch(e){}}
function b2a(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(pw){
 var P=JSON.parse(atob(BLOB));
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
 for(var n=0;n<P.k.length;n++){
   var e=P.k[n];
   try{
     var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(e.s),iterations:P.it,hash:'SHA-256'},
       km,{name:'AES-GCM',length:256},false,['decrypt']);
     var raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(e.i)},kek,b2a(e.w));
     var cek=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
     var blob=b2a(P.perClient? e.c : P.c);
     var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},cek,blob.slice(12));
     return new TextDecoder().decode(pt);
   }catch(err){}
 }
 throw new Error('bad password');
}
async function go(pw,silent){
 var btn=document.getElementById('go'), msg=document.getElementById('msg');
 if(!silent){btn.disabled=true;btn.textContent='Unlocking\u2026';msg.textContent='';}
 try{
   var html=await unlock(pw);
   skWrite(pw);
   document.open();document.write(html);document.close();
 }catch(e){
   if(!silent){msg.textContent='Incorrect password.';btn.disabled=false;btn.textContent='Unlock';}
   else{skClear();}
 }
}
document.getElementById('go').onclick=function(){go(document.getElementById('pw').value,false)};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go(this.value,false)});
